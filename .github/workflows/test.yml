name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  schemas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libxml2-utils shellcheck
      - name: Check schemas
        run: ./tools/check.sh
      - name: Check shell scripts
        run: shellcheck tools/*.sh
