name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  schemas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libxml2-utils shellcheck
      - name: Check schemas
        run: ./tools/check.sh
      - name: Check shell scripts
        run: shellcheck tools/*.sh
