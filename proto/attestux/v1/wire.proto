syntax = "proto3";

package attestux.v1;

option java_multiple_files = true;
option java_package = "com.github.attestux.protocol.v1";
option go_package = "github.com/attestux/protocol-go/attestux/v1;attestuxv1";

message AttestationChallenge {
  // Requests key discovery. The quote challenge is delivered by credential activation.
  // Version 1 uses activation followed by a quote over SHA-256(secret).
  uint32 protocol_version = 1;
}

// Initial prover response; future optional session capabilities belong here.
message AttestationHello {
  AttestationKeys keys = 1;
}

message AttestationKeys {
  bytes attestation_public = 1;
  bytes ak_create_data = 2;
  bytes ak_create_attestation = 3;
  bytes ak_create_signature = 4;
  repeated EndorsementKey endorsement_keys = 5;
}

message Quote {
  // extraData is SHA-256 of the recovered activation secret, never the secret itself.
  bytes quote = 1;
  bytes signature = 2;
}

message Pcr {
  uint32 index = 1;
  bytes digest = 2;
}

message PcrBankEvidence {
  uint32 hash_algorithm = 1;
  Quote quote = 2;
  repeated Pcr pcrs = 3;
}

message EndorsementKey {
  bytes public_key = 1;
  bytes certificate = 2;
}

message AttestationEvidence {
  AttestationKeys keys = 1;
  repeated PcrBankEvidence pcr_banks = 2;
  bytes event_log = 3;
}

message CredentialActivationChallenge {
  bytes endorsement_key_sha256 = 1;
  bytes credential = 2;
  bytes encrypted_secret = 3;
}

enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;
  VERIFICATION_STATUS_PENDING_ACTIVATION = 1;
  VERIFICATION_STATUS_VERIFIED = 2;
  VERIFICATION_STATUS_FAILED = 3;
}

enum TrustPolicy {
  TRUST_POLICY_UNSPECIFIED = 0;
  TRUST_POLICY_NUVOTON = 1;
  TRUST_POLICY_ATTESTUX_SIMULATOR = 2;
}

message VerificationReceipt {
  string device_id = 1;
  repeated string errors = 2;
  // Hash of the raw evidence response, or raw AttestationHello on early rejection.
  bytes evidence_sha256 = 3;
  TrustPolicy trust_policy = 4;
  VerificationStatus status = 5;
}

enum ProtocolErrorCode {
  PROTOCOL_ERROR_CODE_UNSPECIFIED = 0;
  PROTOCOL_ERROR_CODE_UNEXPECTED_MESSAGE = 1;
  PROTOCOL_ERROR_CODE_INVALID_CHALLENGE = 2;
  PROTOCOL_ERROR_CODE_ATTESTATION_FAILED = 3;
  PROTOCOL_ERROR_CODE_INTERNAL = 4;
  PROTOCOL_ERROR_CODE_ACTIVATION_FAILED = 5;
  PROTOCOL_ERROR_CODE_DEVICE_MISMATCH = 6;
}

// Final verifier response; future optional session selection belongs here.
message AttestationResult {
  VerificationReceipt receipt = 1;
}

message ProtocolError {
  ProtocolErrorCode code = 1;
  string message = 2;
}

// One USB frame behind a big-endian u32 length. The payload limits are
// 32 MiB for evidence and 64 KiB for everything else.
message Frame {
  oneof payload {
    AttestationChallenge challenge = 1;
    // Encoded AttestationEvidence, kept intact for the receipt hash.
    bytes evidence = 2;
    CredentialActivationChallenge activation_challenge = 3;
    // Encoded AttestationHello, retained intact if verification fails before quoting.
    bytes hello = 4;
    AttestationResult result = 5;
    ProtocolError error = 6;
  }
}
